[package]
name = "proofsheet"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "CssStyleDeclaration", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement", "MediaQueryList", "MouseEvent", "PointerEvent"] }
gloo-net = "0.8.0"
gloo-timers = { version = "0.4.1", features = ["futures"] }

[profile.release]
opt-level = "s"
lto = true
